<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CERO — Iniciar sesión</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1e1e1e;
      color: #e4e4e4;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      background: #252526;
      border: 1px solid #3c3c3c;
      border-radius: 8px;
      padding: 40px 36px;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    .login-logo {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #e4e4e4;
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 12px;
      color: #a0a0a0;
      margin-bottom: 32px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: #a0a0a0;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    input {
      width: 100%;
      padding: 9px 12px;
      background: #2d2d30;
      border: 1px solid #3c3c3c;
      border-radius: 6px;
      color: #e4e4e4;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 150ms ease;
    }

    input:focus {
      border-color: #4fc3f7;
    }

    input::placeholder {
      color: #6e6e6e;
    }

    .btn-login {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      background: #1a3a5c;
      border: 1px solid #4285f4;
      border-radius: 6px;
      color: #8ab4f8;
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      transition: background 150ms ease;
    }

    .btn-login:hover {
      background: #1e4a78;
    }

    .btn-login:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .error-msg {
      display: none;
      margin-top: 14px;
      padding: 9px 12px;
      background: #3d1f1f;
      border: 1px solid #ea4335;
      border-radius: 6px;
      color: #f28b82;
      font-size: 13px;
    }

    .error-msg.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">CERO</div>
    <div class="login-subtitle">Panel de Administración</div>

    <form id="form-login" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" placeholder="usuario@cero.com" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn-login" id="btn-submit">Iniciar sesión</button>
      <div class="error-msg" id="error-msg">Credenciales inválidas</div>
    </form>
  </div>

  <script>
    // Si ya hay token activo, ir directo al panel
    if (sessionStorage.getItem('cero_token')) {
      window.location.replace('/panel#vehiculos/dashboard');
    }

    var form = document.getElementById('form-login');
    var btn = document.getElementById('btn-submit');
    var errorMsg = document.getElementById('error-msg');

    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      errorMsg.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Ingresando…';

      var email = document.getElementById('email').value.trim();
      var password = document.getElementById('password').value;

      try {
        var res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password })
        });

        var data = await res.json();

        if (res.ok && data.token) {
          sessionStorage.setItem('cero_token', data.token);
          window.location.replace('/panel#vehiculos/dashboard');
        } else {
          errorMsg.classList.add('visible');
          btn.disabled = false;
          btn.textContent = 'Iniciar sesión';
        }
      } catch (err) {
        errorMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Iniciar sesión';
      }
    });
  </script>
</body>
</html>
