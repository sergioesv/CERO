<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CERO — Panel de Administración</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/theme-light.css">
  <link rel="stylesheet" href="/css/theme-dark.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/layout.css">
</head>
<body data-theme="light">
  <div class="app">
    <header class="header">
      <button class="btn-hamburguesa" onclick="toggleSidebar()" aria-label="Menú">☰</button>
      <a href="/" class="header-logo">CERO</a>
      <nav class="header-modules" id="header-modules"></nav>
      <div class="header-spacer"></div>
      <button class="header-theme-toggle" id="theme-toggle" title="Cambiar tema">🌙</button>
      <div class="header-user" id="header-user">Administrador</div>
      <button class="topbar-logout" onclick="CeroApp.cerrarSesion()" title="Cerrar sesión">✕</button>
    </header>
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="main"></main>
  </div>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
  <div class="toast-container" id="toast-container"></div>
  <div id="modal-container"></div>
  
  <script>
    // Verificar sesión activa
    if (!sessionStorage.getItem('cero_token')) {
      window.location.replace('/login');
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/theme.js"></script>
  <script src="/components/toast.js"></script>
  <script src="/components/modal.js"></script>
  <script src="/components/table.js"></script>
  <script src="/components/badge.js"></script>
  <script src="/components/card.js"></script>
  <script src="/components/sidebar.js"></script>
  <script src="/js/router.js"></script>
  <script src="/modules/vehiculos/flota.js"></script>
  <script src="/modules/vehiculos/preoperacionales.js"></script>
  <script src="/modules/posoperacionales.js"></script>
  <script src="/modules/tanqueos.js"></script>
  <script src="/modules/vehiculos/alertas.js"></script>
  <script src="/modules/vehiculos/conductores.js"></script>
  <script src="/modules/sedes.js"></script>
  <script src="/modules/usuarios.js"></script>
  <script src="/modules/dashboard.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
